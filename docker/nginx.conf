# Serves the production build (build/production) as a static site.
server {
    listen 8080;
    listen [::]:8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;

    gzip on;
    gzip_types text/css application/javascript image/svg+xml application/json;

    # Hashed build files never change, so browsers may keep them for good.
    # A missing asset is a real 404, never the HTML page.
    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
        include /etc/nginx/security-headers.conf;
    }

    # Desk Garden is a single page with no client-side routes. Any other path falls back to
    # index.html, so a bookmarked or mistyped URL still opens the app instead of a 404.
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
        include /etc/nginx/security-headers.conf;
    }
}
